<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>长卷</title>
<!--
  启动动画（2026-11-03）。

  ## 为什么单独一个窗口，而不是在主窗口里画

  主窗口要等 React 挂载、config:get 与 project:list 两个 IPC 往返才画出东西，
  这段时间本来就是白屏。启动动画必须**在 React 之前**就出现，
  所以只能是一个独立的、更早加载的窗口。

  ## 动画怎么排的（按时间）

  0ms    卡片淡入 + 从 0.96 放大（几乎察觉不到，只是"有东西出现了"）
  80ms   标记用 clip-path 的圆**从中心扩散**揭示 —— 像一滴墨落在纸上，不是淡入
  220ms  名字淡入并上移 8px
  300ms  副标题跟上（再慢就啰嗦了）
  380ms  底部细线从左往右长出来（表示"正在准备"）
  …      主窗口 ready 后由主进程给 html 加 .done → 整体淡出 220ms

  ## 为什么不用"描边路径自己画出来"

  图标是一条渐细的笔迹，SVG stroke 只有一个固定宽度；
  真按路径做要拆成几百段，收益远不如风险大。圆形扩散既像墨，又稳。

  ## ⚠ 这个文件必须放在 electron/ 下

  electron-builder 的 files 只收 dist/**、electron/**、package.json、build/icon.ico。
  放项目根目录的话，开发时正常、打包后**直接 404**，启动动画变成一块黑方块。
-->
<style>
  :root {
    --paper: #faf9f7;
    --ink: #1f2328;
    --ink-soft: #6b6f76;
    --line: #e6e3de;
    --gold: #8b6f47;
    --spring: cubic-bezier(.34, 1.32, .58, 1);
    --ease: cubic-bezier(.22, .61, .36, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    cursor: default;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 100%; height: 100%;
    border-radius: 22px;
    background: color-mix(in srgb, var(--paper) 97%, transparent);
    border: 1px solid color-mix(in srgb, var(--ink) 7%, transparent);
    box-shadow: 0 18px 50px -12px rgba(0, 0, 0, .28);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    animation: cardIn 240ms var(--ease) backwards;
    transition: opacity 200ms var(--ease), transform 200ms var(--ease);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: scale(.96); }
    to   { opacity: 1; transform: scale(1); }
  }
  /* ⚠⚠ 这里**不能**用 `animation-fill-mode: forwards`。
     实测：forwards 会把末帧的 `opacity:1` 永久挂在元素上，
     而**动画的优先级高于普通声明** —— 于是下面 `html.done .card { opacity:0 }`
     完全不生效，启动动画收不掉，屏幕上永远留一块卡片。
     （判据里量到的就是 1 → 1。）
     正确做法：基础值就是 1，动画只负责"从 0 进来"，用 backwards 兜住起始帧。 */

  .mark {
    width: 84px; height: 84px;
    border-radius: 19px;
    overflow: hidden;
    /* 中心扩散：像墨滴落到纸上 */
    clip-path: circle(0% at 50% 50%);
    transform: scale(.9) rotate(-7deg);
    animation:
      reveal 700ms var(--ease) 70ms forwards,
      settle 700ms var(--spring) 70ms forwards;
  }
  .mark img { width: 100%; height: 100%; display: block; }

  @keyframes reveal {
    from { clip-path: circle(0% at 50% 50%); }
    to   { clip-path: circle(78% at 50% 50%); }
  }
  @keyframes settle {
    from { transform: scale(.9) rotate(-7deg); }
    to   { transform: scale(1) rotate(0deg); }
  }

  .title {
    margin-top: 18px;
    font-size: 23px;
    font-weight: 600;
    letter-spacing: .22em;
    /* 字距会在右边多出半格，补回来才真正居中 */
    text-indent: .22em;
    color: var(--ink);
    opacity: 0; transform: translateY(8px);
    animation: rise 420ms var(--ease) 220ms forwards;
  }

  .sub {
    margin-top: 7px;
    font-size: 11px;
    letter-spacing: .08em;
    color: var(--ink-soft);
    opacity: 0; transform: translateY(6px);
    animation: rise 420ms var(--ease) 300ms forwards;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }

  .bar {
    margin-top: 22px;
    width: 96px; height: 2px;
    border-radius: 2px;
    background: color-mix(in srgb, var(--ink) 9%, transparent);
    overflow: hidden;
  }
  .bar i {
    display: block; height: 100%; width: 0;
    border-radius: 2px;
    background: var(--gold);
    animation: grow 1200ms var(--ease) 420ms forwards;
  }
  @keyframes grow {
    from { width: 0; }
    /* 不做到 100%：那等于承诺"马上好了"。停在 82% 更诚实，也更好看 */
    to   { width: 82%; }
  }

  /* ---------------- 诗句（2026-11-03） ----------------
     内容由主进程随机挑一句注入（electron/poem-lines.js），
     页面这边只负责显示 —— 诗句是内容，不该写死在动画代码里。

     ⚠ `min-height` 不是装饰：一句诗可能是 12 字（一行），也可能是 24 字（两行）。
       不预留高度的话，每启动一次卡片里的东西就整体上下跳一次。
     ⚠ 空着也不塌：注入失败时这里留白，不会把布局挤变形。 */
  .poem {
    margin-top: 20px;
    min-height: 62px;
    width: 320px;
    display: flex; flex-direction: column; align-items: center;
    text-align: center;
    opacity: 0; transform: translateY(6px);
    animation: rise 460ms var(--ease) 620ms forwards;
  }
  .poem-text {
    font-size: 12.5px;
    line-height: 1.8;
    letter-spacing: .02em;
    color: var(--ink-soft);
    /* 两行封顶：再长就该换一句了，而不是把卡片撑破 */
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .poem-by {
    margin-top: 3px;
    font-size: 10.5px;
    letter-spacing: .04em;
    color: var(--ink-soft);
    opacity: .62;
  }

  /* 主进程在主窗口 ready 时加这个类 */
  html.done .card {
    opacity: 0;
    transform: scale(1.03);
  }

  @media (prefers-reduced-motion: reduce) {
    .card, .mark, .title, .sub, .bar i, .poem {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
      clip-path: none !important;
      width: 82% !important;
    }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mark"><img src="logo.svg" alt="" /></div>
    <div class="title">长卷</div>
    <div class="sub">WriteTool · 长篇写作</div>
    <div class="bar"><i></i></div>
    <div class="poem" id="poem">
      <div class="poem-text" id="poem-text"></div>
      <div class="poem-by" id="poem-by"></div>
    </div>
  </div>

  <script>
    /**
     * 主进程挑好一句诗之后调这个。
     *
     * ⚠ 为什么用注入而不是把诗句数组写在这里：
     *   1. 诗句是**内容**，判据要能单独 require 出来数条数；
     *   2. 写在这里意味着"每一句都要在 HTML 和判据里各维护一份"，
     *      早晚会不同步。
     * ⚠ 为什么不在页面里自己随机：随机源应该只有一个地方（主进程），
     *   否则"每次启动不同"这件事就有两套实现，测起来也说不清。
     * ⚠ 注入失败时不显示任何东西（留白），**不要**放默认句 ——
     *   默认句会和"随机"混在一起，让人以为随机没生效。
     */
    window.__setPoem = function (line) {
      if (!line || !line.t) return false;
      var t = document.getElementById('poem-text');
      var b = document.getElementById('poem-by');
      if (!t || !b) return false;
      t.textContent = '「' + line.t + '」';
      /**
       * ⚠ 《诗经》那几条作者是「佚名」，写成「—— 佚名《诗经·小雅·车舝》」
       *   读起来像个人名。这种就直接只留篇名。
       */
      b.textContent = !line.a
        ? ''
        : (line.a === '佚名'
          ? ('——《' + (line.w || '') + '》')
          : ('—— ' + line.a + (line.w ? '《' + line.w + '》' : '')));
      return true;
    };
  </script>
</body>
</html>
