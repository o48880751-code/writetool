<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      ⚠⚠ img-src 必须显式列出来（2026-11-02 补）。
      不写 img-src 时图片会退回 default-src 'self'，于是：
        · `data:` 的图**加载不出来** —— 封面合成时"底图没能加载"就是这么来的
          （应用内自定义协议 appbg/wtfile 有 bypassCSP 豁免，data: 没有）
        · 以后"粘贴图片让模型看图"也要走 data:，同样会被挡
      只放开图片，不放 script/connect：data: 的图不能执行代码，风险很小。
    -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' appfont:; img-src 'self' data: blob: appbg: wtfile: appfont:; connect-src 'self'" />
    <title>长卷</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
